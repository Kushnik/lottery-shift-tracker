<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Roy's Instant Lottery Shift Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { background-color: #0b0f17; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    @keyframes scanline {
      0% { top: 12%; opacity: 0.2; }
      50% { top: 88%; opacity: 1; }
      100% { top: 12%; opacity: 0.2; }
    }
    .scanner-laser {
      position: absolute; left: 6%; width: 88%; height: 2px;
      background: #10b981; box-shadow: 0 0 14px 2px #10b981;
      animation: scanline 1.5s infinite ease-in-out;
    }
    #reader video { object-fit: cover !important; border-radius: 1.25rem; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-28">

  <!-- Top Sticky Header -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 shadow">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
      <div>
        <h1 class="text-base font-extrabold text-white tracking-tight flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          Roy's Instant Lottery
        </h1>
        <p id="headerSub" class="text-[11px] text-slate-400 font-medium">70-Slot Continuous Shift Tracker</p>
      </div>
      <button onclick="openScannerModal()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-4 py-2 rounded-xl text-xs flex items-center gap-2 shadow-lg shadow-emerald-500/25 active:scale-95 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
        Scan Ticket
      </button>
    </div>
  </header>

  <!-- Controls & Stats Panel -->
  <main class="max-w-5xl w-full mx-auto px-4 mt-3 space-y-3 flex-1">
    
    <!-- Shift Meta Header -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-xs shadow-sm">
      <div>
        <label class="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-1">Date</label>
        <input type="date" id="shiftDate" onchange="updateDateDisplay()" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2 font-medium focus:ring-1 focus:ring-emerald-500 focus:outline-none">
        <span id="dayLabel" class="text-[10px] text-emerald-400 font-bold mt-1 block"></span>
      </div>
      <div>
        <label class="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-1">Shift</label>
        <select id="shiftSelect" onchange="changeShift(this.value)" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2 font-medium focus:ring-1 focus:ring-emerald-500 focus:outline-none">
          <option value="1">Shift 1 (Day / Open)</option>
          <option value="2">Shift 2 (Mid / Close)</option>
          <option value="3">Shift 3 (Night)</option>
        </select>
      </div>
      <div>
        <label class="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-1">Cashier</label>
        <select id="employeeSelect" onchange="saveCurrentEmployee()" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2 font-medium focus:ring-1 focus:ring-emerald-500 focus:outline-none">
          <option value="Lynn Shene">Lynn Shene (Manager)</option>
          <option value="Shannon">Shannon</option>
          <option value="Jeckie">Jeckie</option>
        </select>
      </div>
      <div>
        <label class="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-1">Progress</label>
        <div class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-center">
          <span id="scannedCount" class="font-black text-emerald-400 text-sm">0 / 70</span>
          <span class="text-[10px] text-slate-400 block font-medium">Slots Scanned</span>
        </div>
      </div>
    </div>

    <!-- Financial Card Banner -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 shadow-sm">
      <div>
        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Calculated Shift Sales</p>
        <p id="shiftTotalMoney" class="text-3xl sm:text-4xl font-black text-emerald-400 tracking-tight">$0.00</p>
        <p id="shiftTotalTickets" class="text-xs text-slate-400 font-medium mt-0.5">0 tickets sold across 70 slots</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="exportDataJSON()" title="Download Backup JSON" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold p-2.5 rounded-xl border border-slate-700 text-xs transition">
          &#128190;
        </button>
        <button onclick="closeAndRollShift()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-4 py-3 rounded-xl text-xs active:scale-95 transition shadow-lg shadow-emerald-600/20 text-center">
          Save Shift &<br><span class="text-emerald-200">Roll Forward</span>
        </button>
      </div>
    </div>

    <!-- Filter Pills -->
    <div class="flex items-center justify-between pt-1">
      <div class="flex gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800">
        <button onclick="setFilter('all')" id="btnFilterAll" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-500 text-slate-950 transition">All (70)</button>
        <button onclick="setFilter('pending')" id="btnFilterPending" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">Pending</button>
        <button onclick="setFilter('scanned')" id="btnFilterScanned" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">Scanned</button>
      </div>
      <span id="lastScanBadge" class="text-[11px] font-mono text-slate-400 hidden sm:inline">Ready to scan</span>
    </div>

    <!-- 70 Bins Grid -->
    <div id="binsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2.5 pt-1"></div>
  </main>

  <!-- Viewfinder Modal -->
  <div id="cameraModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-3 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm overflow-hidden flex flex-col shadow-2xl">
      <div class="p-3 bg-slate-850 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-xs font-extrabold text-white tracking-wide uppercase">Scan Bottom Barcode</span>
        </div>
        <button onclick="closeScannerModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2 py-1">&times;</button>
      </div>

      <div class="relative w-full h-64 bg-black flex items-center justify-center overflow-hidden">
        <div id="reader" class="w-full h-full"></div>
        <div class="absolute w-60 h-24 border-2 border-emerald-400 rounded-xl pointer-events-none flex flex-col items-center justify-between p-1.5">
          <span class="text-[9px] text-emerald-300 font-mono bg-black/80 px-2 py-0.5 rounded">ALIGN BOTTOM BARCODE</span>
          <div class="scanner-laser"></div>
          <span class="text-[8px] text-amber-300 font-mono bg-black/80 px-2 py-0.5 rounded">IGNORE VERTICAL UPC</span>
        </div>
      </div>

      <div class="p-3 bg-slate-900 border-t border-slate-800 text-center">
        <p id="cameraStatusText" class="text-xs text-slate-300 font-medium">Point at the horizontal barcode at the bottom of the ticket.</p>
        <button onclick="closeScannerModal()" class="mt-3 w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold py-2.5 rounded-xl border border-slate-700">
          Close Scanner
        </button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz-LOpBatFlViqL_Jmuolou6kLOBAOg5TqElU9W4kUU-Sdi_Gd6m_CgBjh_Y6tHB-JP/exec";

    let bins = [];
    let currentShift = 1;
    let currentFilter = 'all';
    let html5QrCode = null;
    let isScannerRunning = false;
    let isProcessingScan = false;
    let audioCtx = null;

    // Initialize global audio context on first user tap (required by mobile Chrome/Safari)
    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function initApp() {
      updateDateDisplay();
      const savedEmp = localStorage.getItem('roys_lottery_employee');
      if (savedEmp) document.getElementById('employeeSelect').value = savedEmp;

      const saved = localStorage.getItem('roys_lottery_bins_v6');
      if (saved) {
        try {
          bins = JSON.parse(saved);
        } catch (e) {
          bins = generate70Slots();
        }
      } else {
        bins = generate70Slots();
      }
      saveBins();
    }

    function generate70Slots() {
      const arr = [];
      for (let i = 1; i <= 70; i++) {
        let price = 5;
        if (i <= 8) price = 1;
        else if (i <= 18) price = 2;
        else if (i <= 42) price = 5;
        else if (i <= 56) price = 10;
        else if (i <= 66) price = 20;
        else price = 30;

        arr.push({
          slot: i,
          gameId: "",
          gameName: `Slot #${i} ($${price})`,
          price: price,
          open: 0,
          close: null,
          scanned: false
        });
      }
      return arr;
    }

    function saveBins() {
      localStorage.setItem('roys_lottery_bins_v6', JSON.stringify(bins));
      renderBins();
    }

    function renderBins() {
      const grid = document.getElementById('binsGrid');
      if (!grid) return;
      grid.innerHTML = '';
      let scannedTotal = 0;
      let totalMoney = 0;
      let totalTickets = 0;

      bins.forEach((bin, idx) => {
        const sold = bin.close !== null ? Math.max(0, bin.close - bin.open) : 0;
        const binAmount = sold * bin.price;
        if (bin.scanned) scannedTotal++;
        totalMoney += binAmount;
        totalTickets += sold;

        if (currentFilter === 'pending' && bin.scanned) return;
        if (currentFilter === 'scanned' && !bin.scanned) return;

        const card = document.createElement('div');
        card.id = `bin-card-${bin.slot}`;
        card.className = `p-3 rounded-2xl border transition-all ${
          bin.scanned 
            ? 'bg-slate-900/90 border-emerald-500/70 shadow-sm ring-1 ring-emerald-500/30' 
            : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'
        }`;

        card.innerHTML = `
          <div class="flex items-center justify-between text-xs mb-1.5">
            <span class="font-extrabold text-white text-xs">#${bin.slot}</span>
            <select onchange="updateBinPrice(${idx}, Number(this.value))" 
                    class="font-black px-1.5 py-0.5 rounded text-[10px] ${bin.price >= 20 ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-emerald-400'} border border-slate-700 focus:outline-none">
              ${[1, 2, 5, 10, 20, 30, 50].map(p => `<option value="${p}" ${bin.price === p ? 'selected' : ''}>$${p}</option>`).join('')}
            </select>
          </div>

          <div class="space-y-0.5 mb-2">
            <input type="text" value="${bin.gameName}" 
                   onchange="updateBinField(${idx}, 'gameName', this.value)"
                   class="w-full bg-transparent border-b border-transparent hover:border-slate-700 focus:border-slate-500 text-[11px] text-slate-200 font-semibold focus:outline-none truncate" />
            <div class="flex items-center gap-1">
              <span class="text-[9px] text-slate-400 uppercase font-mono font-bold">Game:</span>
              <input type="text" value="${bin.gameId}" 
                     placeholder="e.g. 0755"
                     onchange="updateBinField(${idx}, 'gameId', this.value.trim())" 
                     class="w-16 bg-slate-950/60 rounded px-1 text-[10px] font-mono text-amber-400 border border-slate-800 focus:outline-none text-center" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-1.5 text-[11px] font-mono">
            <div class="bg-slate-950/60 p-1.5 rounded-xl border border-slate-800 text-center">
              <span class="text-[8px] text-slate-400 font-bold block uppercase">Open</span>
              <input type="number" value="${bin.open}" 
                     onchange="updateBinField(${idx}, 'open', parseInt(this.value, 10) || 0)"
                     class="w-full bg-transparent text-center font-bold text-slate-300 focus:outline-none" />
            </div>
            <div class="bg-slate-950/60 p-1.5 rounded-xl border ${bin.scanned ? 'border-emerald-500/50 bg-emerald-950/10' : 'border-slate-800'} text-center">
              <span class="text-[8px] ${bin.scanned ? 'text-emerald-400' : 'text-slate-400'} font-bold block uppercase">Close</span>
              <input type="number" value="${bin.close !== null ? bin.close : ''}" placeholder="--" 
                     onchange="manualCloseInput(${bin.slot}, this.value)"
                     class="w-full bg-transparent text-center font-black ${bin.scanned ? 'text-emerald-400' : 'text-slate-300'} focus:outline-none" />
            </div>
          </div>

          <div class="mt-2 pt-1.5 border-t border-slate-800 flex items-center justify-between text-[11px]">
            <span class="text-slate-400 text-[10px]">${sold} sold</span>
            <span class="font-extrabold ${binAmount > 0 ? 'text-emerald-400' : 'text-slate-400'}">$${binAmount.toFixed(2)}</span>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('scannedCount').innerText = `${scannedTotal} / 70`;
      document.getElementById('shiftTotalMoney').innerText = `$${totalMoney.toFixed(2)}`;
      document.getElementById('shiftTotalTickets').innerText = `${totalTickets} tickets sold`;
    }

    function updateBinField(idx, field, val) {
      bins[idx][field] = val;
      saveBins();
    }

    function updateBinPrice(idx, price) {
      bins[idx].price = price;
      saveBins();
    }

    function manualCloseInput(slotNum, val) {
      const bin = bins.find(b => b.slot === slotNum);
      if (bin) {
        bin.close = val === '' ? null : parseInt(val, 10);
        bin.scanned = val !== '';
        saveBins();
      }
    }

    function setFilter(type) {
      currentFilter = type;
      ['all', 'pending', 'scanned'].forEach(f => {
        const btn = document.getElementById(`btnFilter${f.charAt(0).toUpperCase() + f.slice(1)}`);
        if (btn) {
          if (f === type) {
            btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-500 text-slate-950 transition";
          } else {
            btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition";
          }
        }
      });
      renderBins();
    }

    // ========================================================
    // RIGID LOTTERY BARCODE PARSER
    // ========================================================
    function parseMichiganLotteryBarcode(raw) {
      const text = raw.trim();

      // Reject retail UPC barcode
      if (text.startsWith("044684") || text.startsWith("44684")) {
        return { error: "UPC ignored. Scan bottom horizontal barcode." };
      }

      // Format with hyphens: 0755-082336-001
      if (text.includes("-")) {
        const parts = text.split("-");
        if (parts.length >= 3) {
          const gameId = parts[0].padStart(4, '0');
          const packNum = parts[1];
          const ticketNum = parseInt(parts[2], 10);
          return { gameId, packNum, ticketNum };
        }
      }

      // Numeric raw 13 or 14 digits
      const clean = text.replace(/[^0-9]/g, '');
      if (clean.length === 13 || clean.length === 14) {
        const gameId = clean.length === 14 ? clean.substring(0, 4) : clean.substring(0, 3).padStart(4, '0');
        const packStart = clean.length === 14 ? 4 : 3;
        const packNum = clean.substring(packStart, packStart + 6);
        const ticketNum = parseInt(clean.substring(packStart + 6, packStart + 9), 10);
        return { gameId, packNum, ticketNum };
      }

      return { error: "Invalid inventory barcode format." };
    }

    // ========================================================
    // SCAN ROUTER WITH GAME DEDUPLICATION SAFEGUARD
    // ========================================================
    function routeScannedTicket(rawText) {
      if (isProcessingScan) return;

      const parsed = parseMichiganLotteryBarcode(rawText);
      if (parsed.error) {
        updateCameraStatus(`<span class="text-amber-400 font-bold">${parsed.error}</span>`);
        return;
      }

      isProcessingScan = true;

      // Check if this Game ID has ALREADY been scanned and completed this shift
      const alreadyScannedBin = bins.find(b => 
        (b.gameId === parsed.gameId || parseInt(b.gameId, 10) === parseInt(parsed.gameId, 10)) && b.scanned
      );

      if (alreadyScannedBin) {
        // REJECT DUPLICATE GAME SCAN WITH LOW BUZZ
        playWarningBuzz();
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        updateCameraStatus(`
          <span class="text-amber-400 font-bold">⚠️ Game #${parsed.gameId} already logged!</span><br>
          <span class="text-slate-400 text-[11px]">Recorded in Slot #${alreadyScannedBin.slot} (Ticket #${alreadyScannedBin.close})</span>
        `);

        setTimeout(() => {
          isProcessingScan = false;
        }, 2000);
        return;
      }

      // Find an unscanned slot that matches this Game ID
      let targetBin = bins.find(b => 
        (b.gameId === parsed.gameId || parseInt(b.gameId, 10) === parseInt(parsed.gameId, 10)) && !b.scanned
      );

      // If game ID is new/unassigned, bind to first available unscanned slot without a game ID
      if (!targetBin) {
        targetBin = bins.find(b => !b.scanned && (!b.gameId || b.gameId === ""));
        if (!targetBin) {
          targetBin = bins.find(b => !b.scanned);
        }
        if (targetBin) {
          targetBin.gameId = parsed.gameId;
          targetBin.gameName = `Game #${parsed.gameId}`;
        }
      }

      if (targetBin) {
        targetBin.close = parsed.ticketNum;
        targetBin.scanned = true;
        saveBins();

        // PLAY CLEAR SUCCESS CHIME & VIBRATE
        playSuccessChime();
        if (navigator.vibrate) navigator.vibrate(120);

        updateCameraStatus(`
          <span class="text-emerald-400 font-black text-sm">✔ Slot #${targetBin.slot} Logged!</span><br>
          <span class="text-slate-300 font-mono text-[11px]">Game ${parsed.gameId} &bull; Close: #${parsed.ticketNum}</span>
        `);

        const card = document.getElementById(`bin-card-${targetBin.slot}`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        updateCameraStatus(`<span class="text-amber-400 font-bold">All 70 slots are already completed!</span>`);
      }

      // 2.5 second cooldown to give cashier time to advance to next slot
      setTimeout(() => {
        isProcessingScan = false;
        document.getElementById('cameraStatusText').innerText = "Ready for next ticket...";
      }, 2500);
    }

    function updateCameraStatus(html) {
      document.getElementById('cameraStatusText').innerHTML = html;
      document.getElementById('lastScanBadge').innerHTML = html;
    }

    // ========================================================
    // DUAL-TONE AUDIO CHIME (High Pleasant POS Register Ding)
    // ========================================================
    function playSuccessChime() {
      try {
        unlockAudio();
        const now = audioCtx.currentTime;

        // Note 1: 987.77 Hz (B5)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(987.77, now);
        gain1.gain.setValueAtTime(0.25, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.12);

        // Note 2: 1760 Hz (A6 - High Chime)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1760, now + 0.08);
        gain2.gain.setValueAtTime(0.3, now + 0.08);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.08);
        osc2.stop(now + 0.35);
      } catch (e) {
        console.warn("Audio chime prevented by browser:", e);
      }
    }

    // Warning Buzz if the same game was already scanned
    function playWarningBuzz() {
      try {
        unlockAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now); // Low warning note
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    // ========================================================
    // CAMERA ENGINE
    // ========================================================
    function openScannerModal() {
      unlockAudio(); // Unlock Web Audio context on user tap
      document.getElementById('cameraModal').classList.remove('hidden');
      document.getElementById('cameraStatusText').innerText = "Starting camera...";
      isProcessingScan = false;

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      const qrConfig = {
        fps: 15,
        qrbox: { width: 280, height: 110 },
        aspectRatio: 1.0,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.CODE_39
        ]
      };

      html5QrCode.start(
        { facingMode: "environment" },
        qrConfig,
        (decodedText) => {
          routeScannedTicket(decodedText);
        },
        () => {}
      ).then(() => {
        isScannerRunning = true;
        document.getElementById('cameraStatusText').innerText = "Align bottom horizontal barcode inside green box.";
      }).catch(err => {
        alert("Camera Error: " + err);
        document.getElementById('cameraStatusText').innerHTML = `<span class="text-rose-400 font-bold">Camera blocked. Check permissions.</span>`;
      });
    }

    function closeScannerModal() {
      if (html5QrCode && isScannerRunning) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          isScannerRunning = false;
          document.getElementById('cameraModal').classList.add('hidden');
        }).catch(() => {
          document.getElementById('cameraModal').classList.add('hidden');
          isScannerRunning = false;
        });
      } else {
        document.getElementById('cameraModal').classList.add('hidden');
      }
    }

    // ========================================================
    // SHIFT ROLL & GOOGLE SHEET SYNC
    // ========================================================
    function closeAndRollShift() {
      const cashier = document.getElementById('employeeSelect').value;
      const date = document.getElementById('shiftDate').value;
      const day = document.getElementById('dayLabel').innerText;

      let totalSold = 0;
      let totalAmount = 0;

      bins.forEach(b => {
        const sold = b.close !== null ? Math.max(0, b.close - b.open) : 0;
        totalSold += sold;
        totalAmount += sold * b.price;
      });

      if (!confirm(`Save Shift ${currentShift} for ${cashier}?\nTotal Sold: ${totalSold} tickets\nTotal Sales: $${totalAmount.toFixed(2)}\n\nThis will send records to your Google Sheet and roll closing numbers forward.`)) {
        return;
      }

      document.getElementById('headerSub').innerText = "Syncing to Google Sheets...";

      const payload = {
        date: date,
        day: day,
        shift: currentShift,
        cashier: cashier,
        totalTicketsSold: totalSold,
        totalSalesAmount: totalAmount,
        bins: bins.map(b => ({
          slot: b.slot,
          gameId: b.gameId,
          name: b.gameName,
          price: b.price,
          open: b.open,
          close: b.close !== null ? b.close : b.open,
          sold: b.close !== null ? Math.max(0, b.close - b.open) : 0
        }))
      };

      fetch(GOOGLE_SHEET_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(() => {
        document.getElementById('headerSub').innerText = "Synced to Google Sheet";
      }).catch(err => {
        console.error("Sheet Sync Warning:", err);
      });

      // Roll forward locally
      bins.forEach(b => {
        b.open = b.close !== null ? b.close : b.open;
        b.close = null;
        b.scanned = false;
      });
      saveBins();

      currentShift = currentShift >= 3 ? 1 : currentShift + 1;
      document.getElementById('shiftSelect').value = currentShift;
      alert(`Shift completed! Data transmitted to Google Sheet.`);
    }

    function exportDataJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bins, null, 2));
      const dl = document.createElement('a');
      dl.setAttribute("href", dataStr);
      dl.setAttribute("download", `roys_lottery_shift_${document.getElementById('shiftDate').value}.json`);
      document.body.appendChild(dl);
      dl.click();
      dl.remove();
    }

    function updateDateDisplay() {
      const picker = document.getElementById('shiftDate');
      if (!picker.value) picker.value = new Date().toISOString().split('T')[0];
      const parts = picker.value.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      document.getElementById('dayLabel').innerText = days[d.getDay()];
    }

    function changeShift(val) { currentShift = parseInt(val, 10); }
    function saveCurrentEmployee() { localStorage.setItem('roys_lottery_employee', document.getElementById('employeeSelect').value); }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
