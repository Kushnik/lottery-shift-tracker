<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Instant Lottery Shift Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5-QRCode Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    #reader video { border-radius: 0.5rem; object-fit: cover; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Top Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-20 shadow-md">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-xl font-bold text-amber-400">Instant Lottery Tracker</h1>
        <p class="text-xs text-slate-400">70-Slot Continuous Shift Reconciliation</p>
      </div>

      <div class="flex items-center gap-2">
        <select id="cashierSelect" class="bg-slate-700 text-sm rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-500">
          <option value="Lynn Shene">Lynn Shene (Manager)</option>
          <option value="Shannon">Shannon</option>
          <option value="Jeckie">Jeckie</option>
        </select>

        <button onclick="exportData()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg border border-slate-600">
          Backup JSON
        </button>
      </div>
    </div>
  </header>

  <!-- Sticky Sales Summary Banner -->
  <div class="bg-slate-800/90 backdrop-blur border-b border-slate-700 px-4 py-3 sticky top-[73px] z-10 shadow">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div>
        <span class="text-xs uppercase tracking-wider text-slate-400">Total Shift Sales</span>
        <div id="totalSalesDisplay" class="text-2xl font-extrabold text-emerald-400">$0.00</div>
      </div>
      <div>
        <span class="text-xs uppercase tracking-wider text-slate-400">Tickets Counted</span>
        <div id="totalTicketsDisplay" class="text-lg font-bold text-slate-200">0</div>
      </div>
      <button onclick="rollForwardShift()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-4 py-2.5 rounded-lg shadow transition">
        Roll Shift &rarr;
      </button>
    </div>
  </div>

  <!-- Slot Grid List -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-3 pb-24">
    <div id="slotsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <!-- 70 Slots injected dynamically -->
    </div>
  </main>

  <!-- Camera Scanner Modal -->
  <div id="scannerModal" class="fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-4 flex flex-col items-center">
      <div class="w-full flex justify-between items-center mb-3">
        <h3 id="modalSlotTitle" class="text-base font-bold text-amber-400">Scan Slot</h3>
        <button onclick="closeScanner()" class="text-slate-400 hover:text-white text-xl font-bold p-1">&times;</button>
      </div>

      <div id="reader" class="w-full h-64 bg-black rounded-lg overflow-hidden border border-slate-600"></div>

      <p class="text-xs text-slate-400 mt-3 text-center">
        Point camera at the ticket barcode (validation code or ticket back).
      </p>

      <button onclick="closeScanner()" class="mt-4 w-full bg-slate-700 hover:bg-slate-600 text-sm font-semibold py-2 rounded-lg">
        Cancel
      </button>
    </div>
  </div>

  <script>
    const TOTAL_SLOTS = 70;
    let slots = [];
    let activeSlotIndex = null;
    let html5QrCode = null;

    // Initialize Slots Data
    function initData() {
      const saved = localStorage.getItem('lottery_slots_data');
      if (saved) {
        try {
          slots = JSON.parse(saved);
        } catch (e) {
          slots = generateDefaultSlots();
        }
      } else {
        slots = generateDefaultSlots();
      }
      renderSlots();
      calculateTotals();
    }

    function generateDefaultSlots() {
      const arr = [];
      const defaultPrices = [1, 2, 5, 10, 20, 30, 50];
      for (let i = 1; i <= TOTAL_SLOTS; i++) {
        let price = 5;
        if (i <= 10) price = 1;
        else if (i <= 20) price = 2;
        else if (i <= 40) price = 5;
        else if (i <= 55) price = 10;
        else if (i <= 65) price = 20;
        else price = 30;

        arr.push({
          slotNumber: i,
          gameName: `Game Slot ${i}`,
          price: price,
          startTicket: 0,
          endTicket: 0,
          packNumber: ''
        });
      }
      return arr;
    }

    function saveState() {
      localStorage.setItem('lottery_slots_data', JSON.stringify(slots));
      calculateTotals();
    }

    // Render Slots into DOM
    function renderSlots() {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';

      slots.forEach((slot, index) => {
        const sold = Math.max(0, (Number(slot.endTicket) || 0) - (Number(slot.startTicket) || 0));
        const slotTotal = sold * slot.price;

        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700/80 rounded-xl p-3 flex flex-col gap-2 shadow-sm";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="bg-slate-700 text-amber-400 font-bold text-xs px-2 py-1 rounded">#${slot.slotNumber}</span>
              <input type="text" value="${slot.gameName}" onchange="updateSlot(${index}, 'gameName', this.value)" 
                     class="bg-transparent border-b border-transparent focus:border-slate-500 font-semibold text-sm focus:outline-none w-36 truncate" />
            </div>
            <select onchange="updateSlot(${index}, 'price', Number(this.value))" 
                    class="bg-slate-700 text-xs font-bold text-amber-400 rounded px-2 py-1 border border-slate-600 focus:outline-none">
              ${[1, 2, 5, 10, 20, 30, 50].map(p => `<option value="${p}" ${slot.price === p ? 'selected' : ''}>$${p}</option>`).join('')}
            </select>
          </div>

          <div class="grid grid-cols-2 gap-2 mt-1">
            <div>
              <label class="text-[10px] uppercase text-slate-400 font-semibold">Start Ticket</label>
              <input type="number" value="${slot.startTicket}" onchange="updateSlot(${index}, 'startTicket', Number(this.value))" 
                     class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-sm font-mono text-center focus:ring-1 focus:ring-amber-500 focus:outline-none" />
            </div>
            <div>
              <label class="text-[10px] uppercase text-slate-400 font-semibold">End Ticket</label>
              <div class="flex gap-1">
                <input type="number" value="${slot.endTicket}" onchange="updateSlot(${index}, 'endTicket', Number(this.value))" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-sm font-mono text-center focus:ring-1 focus:ring-amber-500 focus:outline-none" />
                <button onclick="openScanner(${index})" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-2.5 rounded-lg flex items-center justify-center font-bold">
                  &#128247;
                </button>
              </div>
            </div>
          </div>

          <div class="flex justify-between items-center text-xs pt-1 border-t border-slate-700/60 mt-1">
            <span class="text-slate-400">Sold: <strong class="text-slate-200">${sold}</strong></span>
            <span class="text-slate-400">Total: <strong class="text-emerald-400">$${slotTotal.toFixed(2)}</strong></span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateSlot(index, field, value) {
      slots[index][field] = value;
      saveState();
      renderSlots();
    }

    function calculateTotals() {
      let totalAmount = 0;
      let totalTickets = 0;

      slots.forEach(slot => {
        const sold = Math.max(0, (Number(slot.endTicket) || 0) - (Number(slot.startTicket) || 0));
        totalTickets += sold;
        totalAmount += sold * slot.price;
      });

      document.getElementById('totalSalesDisplay').textContent = `$${totalAmount.toFixed(2)}`;
      document.getElementById('totalTicketsDisplay').textContent = totalTickets;
    }

    // Roll Forward for Next Shift
    function rollForwardShift() {
      const cashier = document.getElementById('cashierSelect').value;
      if (!confirm(`Complete shift for ${cashier}?\nThis will advance all End tickets to Start tickets for the next shift.`)) {
        return;
      }

      slots.forEach(slot => {
        slot.startTicket = slot.endTicket;
      });

      saveState();
      renderSlots();
      alert(`Shift completed. Start tickets rolled forward.`);
    }

    // Camera Scanner Handling
    function openScanner(slotIndex) {
      activeSlotIndex = slotIndex;
      const slot = slots[slotIndex];
      document.getElementById('modalSlotTitle').textContent = `Scan Slot #${slot.slotNumber} ($${slot.price})`;
      document.getElementById('scannerModal').classList.remove('hidden');

      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 15, qrbox: { width: 250, height: 160 }, aspectRatio: 1.33 };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          handleScannedBarcode(decodedText);
        },
        () => {}
      ).catch(err => {
        alert("Camera error: " + err);
        closeScanner();
      });
    }

    function handleScannedBarcode(rawBarcode) {
      // Clean string
      const clean = rawBarcode.trim();
      let ticketNum = null;

      // Michigan Lottery 24-digit validation barcode parsing:
      // Typically: GGGG-PPPPPP-TTT-VVVV (Game 4, Pack 6, Ticket 3, Validation 11)
      if (clean.length >= 13 && !isNaN(clean)) {
        ticketNum = parseInt(clean.substring(10, 13), 10);
      } else if (clean.includes('-')) {
        const parts = clean.split('-');
        if (parts.length >= 3) {
          ticketNum = parseInt(parts[2], 10);
        }
      } else {
        // Fallback: extract last 2 or 3 digits
        const match = clean.match(/(\d{2,3})$/);
        if (match) ticketNum = parseInt(match[1], 10);
      }

      if (ticketNum !== null && !isNaN(ticketNum)) {
        slots[activeSlotIndex].endTicket = ticketNum;
        saveState();
        renderSlots();
        closeScanner();
      } else {
        alert(`Barcode detected (${clean}), could not determine ticket number. Please enter manually.`);
      }
    }

    function closeScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('scannerModal').classList.add('hidden');
        }).catch(() => {
          document.getElementById('scannerModal').classList.add('hidden');
        });
      } else {
        document.getElementById('scannerModal').classList.add('hidden');
      }
      activeSlotIndex = null;
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(slots, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `lottery_shift_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    window.onload = initData;
  </script>
</body>
</html>
